<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success-container {
            text-align: center;
            padding: 40px 20px;
        }
        .success-message {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .success-message h1 {
            margin: 0;
            font-size: 28px;
        }
        .success-message p {
            margin: 10px 0 0 0;
            font-size: 16px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .back-link:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-container">
            <div class="success-message">
                <h1>Thank You!</h1>
                <p>Your form has been submitted successfully.</p>
            </div>
            <p>We have received your information and will get back to you soon.</p>
            <a href="index.html" class="back-link">Go Back to Form</a>
        </div>
    </div>
</body>
</html>
