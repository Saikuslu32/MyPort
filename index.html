<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset>
        <div class="container">
            <form action="submit_response.html" method="get">
                <fieldset>
                    <div>
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="full name" aria-describedby="name-help">
                        <small id="name-help">Enter your full name</small>
                    </div>
                </fieldset>
                <fieldset>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email address" aria-describedby="email-help">
                        <small id="email-help">Enter your email address</small>
                    </div>
                </fieldset>
                <fieldset>
                    <div>
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="phone number" aria-describedby="phone-help">
                        <small id="phone-help">Enter your phone number</small>
                    </div>
                </fieldset>
                <fieldset>
                    <div>
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="full address" aria-describedby="address-help">
                        <small id="address-help">Enter your full address</small>
                    </div>
                </fieldset>
                <button type="submit">Submit</button>
            </form>
        </div>
    </fieldset>
</body>
</html>
